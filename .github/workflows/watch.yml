name: watch
on:
  #schedule:
  #- cron: "32-57/5 19 * * *"       # 8:32–8:57am NZ
  #- cron: "2-57/5 20-23,0-7 * * *" # 9:02am–8:57pm NZ
  #- cron: "2 8 * * *"              # 9:02pm NZ
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen sessions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json 2>/dev/null && git commit -m "seen sessions" && git push || true
